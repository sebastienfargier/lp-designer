<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Section Campagne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* === Tokens Studi — Généré par scripts/build-tokens.mjs depuis brand/studi-colors.json et brand/studi-tokens.json — ne pas modifier à la main (npm run tokens). === */
    :root {
      --brand-green:                    #0D302D;
      --brand-green-soft:               #E9F6F5;
      --accent-1:                       #EDF878;
      --accent-2:                       #F87363;
      --accent-2-soft:                  #FFCCD1;
      --neutral-0:                      #FFFFFF;
      --neutral-50:                     #FAFAF9;
      --neutral-100:                    #F5F5F4;
      --neutral-200:                    #E7E5E4;
      --neutral-300:                    #D7D3D0;
      --neutral-400:                    #A9A39D;
      --neutral-500:                    #79726B;
      --neutral-600:                    #58544D;
      --neutral-700:                    #45413B;
      --neutral-800:                    #2F2A28;
      --neutral-900:                    #1D1916;
      --neutral-950:                    #0C0A09;
      --orange-50:                      #FEF2F3;
      --orange-100:                     #FFE3E6;
      --orange-200:                     #FFCCD1;
      --orange-300:                     #FFA8A7;
      --orange-400:                     #F87363;
      --orange-500:                     #F04A33;
      --orange-600:                     #DC2D0D;
      --orange-700:                     #B82307;
      --orange-800:                     #981F0F;
      --orange-900:                     #7E2016;
      --orange-950:                     #450C06;
      --success:                        #16A34A;
      --warning:                        #F59E0B;
      --danger:                         #DC2626;
      --info:                           #2563EB;
      --accent-1-hover:                 #DAE46E;
      --accent-1-active:                #C7D065;
      --logo:                           #070A0D;
      --logo-black: var(--logo); /* alias historique des maquettes */

      --font-sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;

      /* Espacements (échelle 4px) */
      --space-4:                        4px;
      --space-6:                        6px;
      --space-8:                        8px;
      --space-12:                       12px;
      --space-16:                       16px;
      --space-24:                       24px;
      --space-32:                       32px;
      --space-48:                       48px;

      /* Rayons */
      --radius-sm:                      6px;
      --radius-md:                      8px;
      --radius-lg:                      10px;
      --radius-xl:                      14px;
      --radius-full:                    9999px;
    }
    /* === Fin des tokens Studi === */

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); background: var(--neutral-950); }

    .section-campagne {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-48) 16px;
      overflow: hidden;
    }

    .section-campagne__bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .section-campagne__bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .section-campagne__bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(82.86deg,
        rgba(12, 10, 9, 0.816) 14.706%,
        rgba(12, 10, 9, 0.439) 37.353%,
        rgba(12, 10, 9, 0.584) 60%);
    }

    .section-campagne__container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      gap: var(--space-48);
    }

    .section-campagne__left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-48);
      width: 100%;
      max-width: 580px;
    }

    .section-campagne__logo {
      display: block;
      width: 99.918px;
      height: 34.722px;
    }

    .section-campagne__content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 32px;
      width: 100%;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-8);
      background: var(--accent-1);
      border-radius: var(--radius-md);
      color: var(--neutral-900);
font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      white-space: nowrap;
    }

    .headline {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      font-size: 48px;
      font-weight: 600;
      line-height: 56px;
      color: var(--neutral-0);
    }
    .headline span {
      display: block;
      padding: var(--space-4) var(--space-12);
      background: var(--brand-green);
      border-radius: var(--radius-md);
    }

    .subtitle {
      margin: 0;
font-size: 20px;
      font-weight: 600;
      line-height: 28px;
      color: var(--neutral-0);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: var(--space-6);
      height: 36px;
      padding: 0 var(--space-16);
      background: var(--accent-1);
      border: 1px solid var(--accent-1);
      border-radius: var(--radius-full);
      color: var(--neutral-900);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color .15s ease, transform .15s ease;
    }
    .cta:hover { background: var(--accent-1-hover); border-color: var(--accent-1-hover); }
    .cta:active { background: var(--accent-1-active); border-color: var(--accent-1-active); transform: translateY(1px); }
    .cta:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 3px; }
    .cta img { display: block; width: 14.406px; height: 11.023px; }

    @media (max-width: 640px) {
      .section-campagne { padding: var(--space-32) 16px; }
      .section-campagne__left { gap: var(--space-32); }
      .headline { font-size: 30px; line-height: 38px; }
      .headline span { padding: var(--space-4) var(--space-8); }
    }
  </style>
</head>
<body>
  <section class="section-campagne">
    <div class="section-campagne__bg" aria-hidden="true">
      <img src="assets/bg-campagne.png" alt="" />
    </div>

    <div class="section-campagne__container">
      <div class="section-campagne__left">
        <img class="section-campagne__logo" src="assets/studi-logo.svg" alt="Studi" width="99.918" height="34.722" />

        <div class="section-campagne__content">
          <span class="badge">Bilan d’orientation gratuit</span>

          <h1 class="headline">
            <span>Votre formation</span>
            <span>est peut-être déjà</span>
            <span>finançable</span>
          </h1>

          <p class="subtitle">30 min pour savoir si c’est jouable</p>

          <a class="cta" href="#">
            Bouton primaire
            <img src="assets/icon-arrow.svg" alt="" width="14.406" height="11.023" />
          </a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
